services:
  # —— 1. MySQL 8.x 关系型数据存储容器（统一集中维护配置、法规、用户及审计账本）——
  mysql:
    image: mysql:8.0
    container_name: legal-advisor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "legal_advisor"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— 2. Elasticsearch 8.x 混合检索与向量库容器（维护稠密向量与全文粗排）——
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: legal-advisor-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— 3. 智能法律顾问智能体业务容器 ——
  legal-advisor:
    build: .
    image: legal-advisor-agent:latest
    container_name: legal-advisor-agent
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      # 默认 MOCK 确定性演示模式
      MOCK: "true"
      TOP_K: "5"
      EMBED_ENABLED: "true"
      EMBED_MODEL: "BAAI/bge-m3"

      # 启用 MySQL 8.x 存储引擎
      STORAGE_BACKEND: "mysql"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DATABASE: "legal_advisor"

      # 启用 Elasticsearch 8.x 向量与粗排
      ES_ENABLED: "true"
      ES_HOSTS: "http://elasticsearch:9200"
      ES_INDEX: "legal_chunks"

      # —— 独立 OCR 识别微服务连接 ——
      OCR_SERVICE_URL: "http://ocr:8001/ocr"

      # —— 独立 Docling 深度文档解析微服务连接 ——
      DOCLING_SERVICE_URL: "http://docling:8002/parse"

      # —— 独立 Ragas RAG 自动评测微服务连接 ——
      RAGAS_SERVICE_URL: "http://ragas:8003/evaluate"

      # —— Arize Phoenix 生产可观测性监控配置 ——
      PHOENIX_ENABLED: "true"
      PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:6006/v1/traces"
      PHOENIX_PROJECT_NAME: "legal-advisor-prod"
      PHOENIX_UI_BASE_URL: "http://localhost:6006"

      # —— 接入真实大模型时可取消注释覆盖 ——
      # MOCK: "false"
      # LLM_PROVIDER: "qwen"
      # LLM_API_KEY: "${LLM_API_KEY}"
      # LLM_API_BASE: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      # LLM_MODEL: "qwen-plus"
      # EMBED_API_BASE: "http://host.docker.internal:11434/v1"
      # EMBED_MODEL: "BAAI/bge-m3"

  # —— 4. 独立轻量级 OCR 识别微服务容器（专职负责图文扫描、附图解析与印章提取）——
  ocr:
    build:
      context: ./docker/ocr
      dockerfile: Dockerfile
    image: legal-advisor-ocr:latest
    container_name: legal-advisor-ocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - HOST=0.0.0.0
      - PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # —— 5. 独立 Docling 深度文档解析微服务容器（专职负责复杂版面还原、双栏排版与表格结构提取）——
  docling:
    build:
      context: ./docker/docling
      dockerfile: Dockerfile
    image: legal-advisor-docling:latest
    container_name: legal-advisor-docling
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - HOST=0.0.0.0
      - PORT=8002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # —— 6. Arize Phoenix 专用 PostgreSQL 8.x/15+ 关系型持久化存储容器 ——
  phoenix-postgres:
    image: postgres:15-alpine
    container_name: legal-advisor-phoenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix_password
      POSTGRES_DB: phoenix
    ports:
      - "5433:5432"
    volumes:
      - phoenix_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 3s
      retries: 10

  # —— 7. Arize Phoenix 生产级 AI & RAG 可观测性监控平台 ——
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: legal-advisor-phoenix
    restart: unless-stopped
    depends_on:
      phoenix-postgres:
        condition: service_healthy
    ports:
      - "6006:6006"   # Phoenix Web UI 控制台 & OTLP HTTP Collector (/v1/traces)
      - "4317:4317"   # OTLP gRPC Collector
    environment:
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"
      PHOENIX_SQL_DATABASE_URL: "postgresql://phoenix:phoenix_password@phoenix-postgres:5432/phoenix"
      # 免密访问配置：设为 false 可跳过登录界面，点击「链路追踪」一键直达 Trace 详情页
      # 若需开启多用户鉴权，可设为 true，默认初始管理员凭据为：admin@localhost / admin
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix_data:/mnt/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # —— 8. 独立 Ragas RAG 多维自动评测微服务容器（vibrantlabsai/ragas 隔离环境）——
  ragas:
    build:
      context: ./docker/ragas
      dockerfile: Dockerfile
    image: legal-advisor-ragas:latest
    container_name: legal-advisor-ragas
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - HOST=0.0.0.0
      - PORT=8003
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  es_data:
    driver: local
  docling_cache:
    driver: local
  phoenix_pg_data:
    driver: local
  phoenix_data:
    driver: local
